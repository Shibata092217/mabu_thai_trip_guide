<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="マブ旅行 タイ 4泊5日" />
    <title>タイ 4泊5日</title>
    <link rel="icon" href="./icon_mabu.jpeg" type="image/jpeg">

    <!-- iPhoneのホーム画面アイコン -->
    <link rel="apple-touch-icon" href="./icon_mabu.jpeg">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">TRAVEL GUIDE / 4N 5D</p>
          <h1>マブ タイ旅行<br />4泊5日<br />スケジュール</h1>
        </div>
        <div class="hero-panel">
          <h2>Casa 17 Hotel Bangkok</h2>
          <img class="hotel-photo" src="https://cf.bstatic.com/xdata/images/hotel/max1024x768/692562613.jpg?k=0b8fb6a4f40130f8b9ee7ea294255a1981a92a98378175642ac05ddc0c7d869b&o=&hp=1" alt="Casa 17 Hotel Bangkok exterior" />
          <div class="links">
            <a href="https://www.booking.com/hotel/th/casa-17.ja.html?chal_t=1786013086738&force_referer=https%3A%2F%2Fwww.google.com%2F" target="_blank" rel="noopener noreferrer">Booking.com</a>
            <a href="https://www.google.com/maps/search/Casa+17+Hotel+Bangkok" target="_blank" rel="noopener noreferrer">Googleマップ</a>
          </div>
        </div>
      </header>

      <nav class="day-nav" aria-label="日程ナビゲーション">
        <a href="#8/21 (金)">Day 1 / 8/21 (金)</a>
        <a href="#8/22 (土)">Day 2 / 8/22 (土)</a>
        <a href="#8/23 (日)">Day 3 / 8/23 (日)</a>
        <a href="#8/24 (月)">Day 4 / 8/24 (月)</a>
        <a href="#8/25 (火)">Day 5 / 8/25 (火)</a>
      </nav>
      <!-- 為替計算ボタン -->
      <button id="exchange-button">
          タイバーツ → 日本円 為替計算
      </button>


      <!-- 為替計算ポップアップ -->
      <div id="exchange-modal" class="modal">

        <div class="modal-content">

          <span id="close-button" class="close">
              &times;
          </span>

          <h2>タイバーツ → 日本円</h2>


          <p id="rate-info"></p>
          <div class="input-area">
              <label>
                  タイバーツ(THB)：
                  <input
                      type="number"
                      id="thb-input"
                  >
              </label>
          </div>

          <button id="calculate-button">
              計算
          </button>

          <p>
              日本円：
              <span id="jpy-result">-</span>
              円
          </p>

        </div>
      </div>
      <div id="schedule-root"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
